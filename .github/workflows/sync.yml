name: Steemit to Serey Auto Sync & Vote

on:
  schedule:
    # 00:00 UTC = 8:00 AM Malaysia Time
    # 10:00 UTC = 6:00 PM Malaysia Time
    # 13:00 UTC = 9:00 PM Malaysia Time
    - cron: '0 0,10,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Serey Sync (Posting)
        env:
          STEEM_USERNAME: ${{ secrets.STEEM_USERNAME }}
          SEREY_LOGIN: ${{ secrets.SEREY_LOGIN }}
          SEREY_PASSWORD: ${{ secrets.SEREY_PASSWORD }}
        run: |
          python main.py

      - name: Run Serey Auto Vote (10 Upvotes)
        run: |
          python auto_vote.py

      - name: Save Synced & Voted Records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ফাইল থাকলে তবেই যোগ করবে
          [ -f synced_posts.json ] && git add synced_posts.json
          [ -f voted_posts.json ] && git add voted_posts.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update synced & voted records [skip ci]"
            git push
          fi
