name: Steemit to Serey

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4,13 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run Steemit to Serey script
        env:
          STEEM_USERNAME: ${{ secrets.STEEM_USERNAME }}
          SEREY_LOGIN: ${{ secrets.SEREY_LOGIN }}
          SEREY_PASSWORD: ${{ secrets.SEREY_PASSWORD }}
        run: python steemit_to_serey.py

      - name: Commit and Push synced_posts.json
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          if [ -f synced_posts.json ]; then
            git add synced_posts.json
            git commit -m "Update synced_posts.json [skip ci]" || echo "No changes"
            git push || echo "Push skipped"
          fi
