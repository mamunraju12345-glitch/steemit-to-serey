name: Steemit to Serey Auto Sync

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Serey Sync
        env:
          STEEM_USERNAME: ${{ secrets.STEEM_USERNAME }}
          SEREY_LOGIN: ${{ secrets.SEREY_LOGIN }}
          SEREY_PASSWORD: ${{ secrets.SEREY_PASSWORD }}
        run: |
          python main.py

      - name: Save Synced Posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add synced_posts.json

          if git diff --cached --quiet; then
            echo "No new posts to update."
          else
            git commit -m "Auto-update synced posts [skip ci]"
            git push
          fi
