name: Steemit to Serey

on:
  workflow_dispatch:
  schedule:
    # বাংলাদেশ সময় প্রতিদিন সকাল ১০:০০ এবং রাত ৭:০০ টায় অটো রান হবে (UTC 04:00 & 13:00)
    - cron: "0 4,13 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run Steemit to Serey script
        env:
          STEEM_USERNAME: ${{ secrets.STEEM_USERNAME }}
          SEREY_LOGIN: ${{ secrets.SEREY_LOGIN }}
          SEREY_PASSWORD: ${{ secrets.SEREY_PASSWORD }}
        run: python steemit_to_serey.py

      # ১. নতুন পোস্ট সিঙ্ক হওয়ার পর synced_posts.json ফাইলটি GitHub-এ সেভ (Commit & Push) করবে
      - name: Commit and Push synced_posts.json
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add synced_posts.json
          git commit -m "Update synced_posts.json [skip ci]" || echo "No changes to commit"
          git push

      # ২. কোনো কারণে ফেল করলে স্ক্রিনশট ডাউনলোড করে দেখার অপশন (Debugging step)
      - name: Upload Error Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "*.png"
